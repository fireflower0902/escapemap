name: 전국 예약 시간표 Supabase 갱신
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '43 15 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '오늘 이후 추가 조회 일수 (0~14)'
        type: choice
        default: '2'
        options: ['2', '7', '14']
permissions:
  contents: read
concurrency:
  group: nationwide-supabase-crawl
  cancel-in-progress: false
jobs:
  crawl:
    name: '전국 수집 ${{ matrix.shard }}'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    env:
      CRAWL_STORAGE: supabase
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      TZ: Asia/Seoul
      CRAWL_SEOUL_ONLY: 'false'
      SKIP_META_WRITES: 'false'
      DAYS: ${{ inputs.days || (github.event.schedule == '43 15 * * *' && '14' || '2') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install crawler browser
        run: uv run playwright install --with-deps chromium
      - name: Collect and publish verified cafes
        run: uv run python scripts/refresh_scheduled.py --days "$DAYS" --shard ${{ matrix.shard }} --shards 8 --workers 2 --timeout 240
      - name: Save per-cafe verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-crawl-${{ matrix.shard }}
          path: |
            backend/reports/scheduled/
            backend/reports/crawlers/supabase/
          retention-days: 7
